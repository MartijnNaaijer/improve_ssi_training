[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ssi"
version = "0.1.0"
description = "Morphological parsing of Classical Syriac in the ETCBC encoding"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
# Install torch from the CUDA index first (see CLAUDE.md), otherwise pip
# picks the CPU-only build from PyPI.
ml = ["torch>=2.6", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
